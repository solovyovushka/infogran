/* Layout: sticky header with segmented tabs, single centered column (max 56rem), cards stack on phones, table on desktop */
:root {
  --bg: 243 245 249;        /* холодный светлый фон */
  --surface: 255 255 255;
  --sunken: 237 240 246;
  --ink: 14 25 48;
  --muted: 86 98 122;
  --line: 219 225 236;
  --brand: 20 46 104;       /* тёмно-синий акцент */
  --brand-soft: 230 236 248;
  --on-brand: 255 255 255;
  --ok: 22 122 64;   --ok-bg: 221 244 230;
  --warn: 146 96 0;  --warn-bg: 254 243 196;
  --anon: 190 72 6;  --anon-bg: 255 233 212;
  --block: 180 30 36; --block-bg: 253 226 226;
  --font-sans: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 11 16 28; --surface: 19 27 44; --sunken: 14 21 36; --ink: 229 234 244; --muted: 148 160 184; --line: 40 52 76;
    --brand: 132 165 236; --brand-soft: 30 43 74; --on-brand: 10 17 32;
    --ok: 96 214 142; --ok-bg: 18 52 35; --warn: 245 201 72; --warn-bg: 58 45 8;
    --anon: 252 150 78; --anon-bg: 66 34 12; --block: 250 118 118; --block-bg: 72 22 26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: 11 16 28; --surface: 19 27 44; --sunken: 14 21 36; --ink: 229 234 244; --muted: 148 160 184; --line: 40 52 76;
  --brand: 132 165 236; --brand-soft: 30 43 74; --on-brand: 10 17 32;
  --ok: 96 214 142; --ok-bg: 18 52 35; --warn: 245 201 72; --warn-bg: 58 45 8;
  --anon: 252 150 78; --anon-bg: 66 34 12; --block: 250 118 118; --block-bg: 72 22 26;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--muted)); }
h1, h2, h3 { text-wrap: balance; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
:focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { animation: bar var(--dur, 900ms) cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes bar { from { width: 4%; } to { width: 100%; } }
.rise { animation: rise .32s ease-out both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: rgb(var(--brand-soft)); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .spin, .bar, .rise, .flash { animation: none !important; } .bar { width: 100%; } }
#boot { padding: 48px 16px; text-align: center; color: rgb(var(--muted)); }
</style>

  ['ORG',      /(?:^|[^А-ЯЁа-яёA-Za-z])(?<v>(?:ООО|ОАО|ЗАО|ПАО|АО|ИП|НКО)\s*["«„“][^"»“”]{1,60}["»“”])/g],
  ['FIO',      /(?<v>[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+)/g, (v) => v.split(/\s+/).some(isPatronymic)],
  ['FIO',      /(?<v>[А-ЯЁ][а-яё]+\s+[А-ЯЁ]\.\s?[А-ЯЁ]\.)/g],
  ['FIO',      /(?<v>[А-ЯЁ]\.\s?[А-ЯЁ]\.\s?[А-ЯЁ][а-яё]+)/g],
];

function detect(text) {
  const found = [];
  for (const [type, re, validate] of RULES) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      const v = m.groups.v;
      const start = m.index + m[0].length - v.length;
      const end = start + v.length;
      if (validate && !validate(v)) { re.lastIndex = m.index + 1; continue; }
      if (!found.some((f) => start < f.end && end > f.start)) found.push({ type, start, end, value: v });
    }
  }
  return found.sort((a, b) => a.start - b.start);
}

const LEVEL_RANK = { block: 3, warn: 2, anon: 1 };
function decide(findings) {
  let top = 0;
  for (const f of findings) top = Math.max(top, LEVEL_RANK[TYPES[f.type].level]);
  return ['allow', 'anon', 'warn', 'block'][top];
}

// Обратимое обезличивание: словарь «метка → исходное значение» живёт только в памяти.
function anonymize(text, findings) {
  const counters = {}, byValue = {}, dict = {};
  let out = '', pos = 0;
  for (const f of findings) {
    const t = TYPES[f.type].tag;
    const key = f.type + '|' + f.value;
    let tag = byValue[key];
    if (!tag) {
      counters[t] = (counters[t] || 0) + 1;
      tag = `<${t}_${counters[t]}>`;
      byValue[key] = tag;
      dict[tag] = f.value;
    }
    out += text.slice(pos, f.start) + tag;
    pos = f.end;
  }
  return { sent: out + text.slice(pos), dict };
}
const restore = (text, dict) => text.replace(/<[A-ZА-ЯЁ]+_\d+>/g, (t) => dict[t] ?? t);

function maskValue(type, v) {
  const d = v.replace(/\D/g, '');
  switch (type) {
    case 'PHONE':    return `+7 ${d.slice(1, 4)} ***-**-${d.slice(-2)}`;
    case 'EMAIL':    { const [u, dom] = v.split('@'); return `${u[0]}***@${dom}`; }
    case 'FIO':      return v.split(/\s+/).map((w) => (w.endsWith('.') ? w : w[0] + '***')).join(' ');
    case 'INN':      return d.slice(0, 2) + '*'.repeat(d.length - 4) + d.slice(-2);
    case 'ACCOUNT':  return d.slice(0, 5) + '*'.repeat(11) + d.slice(-4);
    case 'CARD':     return '**** **** **** ' + d.slice(-4);
    case 'PASSPORT': return '** ** ****' + d.slice(-2);
    case 'APIKEY':   { const p = v.match(/^[A-Za-z]+[-_](?:live[-_]|test[-_])?/); return (p ? p[0] : v.slice(0, 3)) + '****'; }
    case 'PASSWORD': return '********';
    case 'IP':       { const p = v.split('.'); return `${p[0]}.${p[1]}.*.*`; }
    case 'ORG':      return v.replace(/(["«„“])(.)[^"»“”]*(["»“”])/, '$1$2***$3');
    default:         return '***';
  }
}
function maskText(text, findings) {
  let out = '', pos = 0;
  for (const f of findings) { out += text.slice(pos, f.start) + maskValue(f.type, f.value); pos = f.end; }
  return out + text.slice(pos);
}

function analyze(text) {
  const findings = detect(text);
  const types = [...new Set(findings.map((f) => f.type))];
  return { text, findings, types, decision: decide(findings), masked: maskText(text, findings) };
}

/* ===== Имитация ответа ИИ (работает только с метками) ===== */
function mockAnswer(sent) {
  const tags = [...new Set(sent.match(/<[A-ZА-ЯЁ]+_\d+>/g) || [])];
  const first = (t) => tags.find((x) => x.startsWith('<' + t + '_'));
  if (/REST|GraphQL/i.test(sent)) {
    return 'REST и GraphQL — два подхода к построению API.\n\n• REST: много адресов-ресурсов (/users/42, /users/42/orders), у каждого фиксированный формат ответа. Легко кэшировать средствами HTTP.\n• GraphQL: один адрес, а клиент сам описывает в запросе, какие поля ему нужны. Нет лишних данных и лишних запросов, но сложнее кэширование и контроль нагрузки на сервер.\n\nКоротко: REST проще и привычнее, GraphQL удобнее, когда клиенту нужны данные из многих связанных сущностей.';
  }
  if (/письм/i.test(sent)) {
    const fio = first('ФИО'), phone = first('ТЕЛЕФОН'), email = first('EMAIL');
    let s = 'Тема: перенос сроков сдачи проекта\n';
    if (fio) s += `Получатель: ${fio}\n`;
    s += '\nДобрый день!\n\nСообщаем, что срок сдачи проекта переносится на две недели. Причина — дополнительное согласование технических требований. Остальные условия договора не меняются.\n\nОбновлённый график работ направим в течение двух рабочих дней.';
    if (phone) s += ` Если удобно обсудить детали голосом, мы перезвоним по номеру ${phone}.`;
    else if (email) s += ` Вопросы можно задать в ответном письме на ${email}.`;
    return s + '\n\nС уважением,\nкоманда проекта';
  }
  if (/договор|реквизит|ИНН|сч[её]т/i.test(sent)) {
    const org = first('ОРГАНИЗАЦИЯ'), inn = first('ИНН');
    let s = `Проверил договор${org ? ' с ' + org : ''}. На что обратить внимание:\n\n`;
    s += '• Срок оплаты не привязан к дате подписания акта — лучше указать конкретное число дней.\n• Нет пункта об ответственности за просрочку поставки.\n';
    if (inn) s += `• Сверьте ИНН ${inn} с выпиской из ЕГРЮЛ перед подписанием.\n`;
    return s + '\nВ остальном формулировки стандартные.';
  }
  let s = 'Разобрал запрос. Предлагаю действовать по шагам: уточнить цель, собрать исходные данные и проверить решение на небольшом примере. Пришлите больше контекста — отвечу подробнее.';
  if (tags.length) s += '\n\nВ ответе учтены: ' + tags.join(', ') + '.';
  return s;
}

          : html`<div className="grid gap-3 md:grid-cols-2">
              <${Panel} label="Ответ ИИ (с метками)" icon=${icons.bot('w-3.5 h-3.5')}><${TagText} text=${r.answer}/><//>
              <${Panel} label="Ответ сотруднику" icon=${icons.user('w-3.5 h-3.5')} tone="!border-ok/40"><${TagText} text=${r.answer} restoreDict=${r.dict}/><//>
            </div>
            <div className="flex items-center gap-2.5 rounded-lg bg-ok-bg text-ok px-4 py-3 font-semibold">${icons.shield('w-5 h-5 shrink-0')}Данные не покинули компанию</div>
            <p className="text-[12.5px] text-muted -mt-1">Словарь «метка → значение» хранится только в памяти и не передаётся в ИИ: ${Object.keys(r.dict).length} ${plural(Object.keys(r.dict).length, 'метка', 'метки', 'меток')}.</p>`}
      </div>`}
    </div>

    <footer className="px-4 py-3 border-t border-line bg-sunken/60 flex items-center justify-between gap-3 text-[13px]">
      <span className="text-muted">Событие записано в журнал ИБ</span>
      <button onClick=${openJournal} className="font-semibold text-brand inline-flex items-center gap-1 whitespace-nowrap">Открыть журнал ${icons.send('w-3.5 h-3.5')}</button>
    </footer>
  </article>`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function WarnDialog({ onAnon, onCancel, types }) {
  useEffect(() => { document.getElementById('warn-anon')?.focus(); }, []);
  return html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-[rgb(var(--ink)/.45)]" role="dialog" aria-modal="true" aria-labelledby="warn-title">
    <div className="w-full sm:max-w-md bg-surface sm:rounded-xl rounded-t-2xl shadow-2xl rise"
         style=${{ paddingLeft: 'max(20px, env(safe-area-inset-left, 0px))', paddingRight: 'max(20px, env(safe-area-inset-right, 0px))', paddingTop: '20px', paddingBottom: 'calc(20px + env(safe-area-inset-bottom, 0px))' }}>
      <div className="flex items-start gap-3">
        <div className="w-10 h-10 rounded-full bg-warn-bg text-warn grid place-items-center shrink-0">${icons.alert('w-5 h-5')}</div>
        <div className="min-w-0">
          <h2 id="warn-title" className="text-[17px] font-bold">В запросе реквизиты заказчика</h2>
          <p className="mt-1 text-[14px] text-muted">Найдено: ${types.map((t) => TYPES[t].label).join(', ')}. Их можно заменить метками — ИИ ответит по сути, а реальные значения вернутся в ответ уже внутри компании.</p>
        </div>
      </div>
      <div className="mt-5 grid gap-2 sm:grid-cols-2">
        <button id="warn-anon" onClick=${onAnon} className="h-11 rounded-lg bg-brand text-on-brand font-semibold sm:order-2">Обезличить и отправить</button>
        <button onClick=${onCancel} className="h-11 rounded-lg border border-line font-semibold text-ink sm:order-1">Отменить</button>
      </div>
    </div>
  </div>`;
}

function EmployeeTab({ onLog, onUpdateLog, openJournal }) {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(null);       // { dur }
  const [result, setResult] = useState(null);
  const [dialog, setDialog] = useState(false);
  const resultRef = useRef(null);

  const submit = () => {
    const t = text.trim();
    if (!t || busy) return;
    const dur = 600 + Math.round(Math.random() * 400);
    setResult(null);
    setBusy({ dur });
    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    setTimeout(() => {
      const analysis = analyze(t);
      const r = { analysis, ms: dur, outcome: null, sent: null, answer: null, dict: {} };
      if (analysis.decision === 'allow') { r.sent = t; r.answer = mockAnswer(t); }
      if (analysis.decision === 'anon') { const an = anonymize(t, analysis.findings); r.sent = an.sent; r.dict = an.dict; r.answer = mockAnswer(an.sent); }
      if (analysis.decision === 'warn') { r.outcome = 'pending'; setDialog(true); }
      r.logId = onLog(analysis, r.outcome);
      setBusy(null);
      setResult(r);
    }, dur);
  };

  const decideWarn = (choice) => {
    if (choice === 'reopen') return setDialog(true);
    setDialog(false);
    setResult((r) => {
      const n = { ...r, outcome: choice };
      if (choice === 'anonymized') { const an = anonymize(r.analysis.text, r.analysis.findings); n.sent = an.sent; n.dict = an.dict; n.answer = mockAnswer(an.sent); }
      onUpdateLog(r.logId, choice);
      return n;
    });
  };

  return html`<div className="grid gap-4">
    <div>
      <div className="eyebrow mb-2">Примеры запросов</div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        ${EXAMPLES.map((e, i) => html`<button key=${i} id=${'ex-' + i} onClick=${() => setText(e.text)}
          className=${`text-left rounded-lg border px-3 py-2.5 text-[13.5px] font-semibold leading-snug transition-colors ${text === e.text ? 'border-brand bg-brand-soft text-brand' : 'border-line bg-surface hover:border-brand/50'}`}>
          <span className="block text-[11px] font-medium text-muted mb-0.5 tnum">Пример ${i + 1}</span>${e.label}</button>`)}
      </div>
    </div>

    <form onSubmit=${(e) => { e.preventDefault(); submit(); }} className="rounded-xl border border-line bg-surface shadow-sm focus-within:border-brand/60">
      <label htmlFor="prompt" className="flex items-center justify-between px-4 pt-3 eyebrow"><span>Запрос к ИИ</span></label>
      <textarea id="prompt" rows="4" value=${text} onInput=${(e) => setText(e.target.value)} onChange=${(e) => setText(e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); }}
        placeholder="Например: составь письмо клиенту о переносе сроков…"
        className="block w-full resize-y bg-transparent px-4 py-2 text-[16px] leading-relaxed outline-none placeholder:text-muted/70 min-h-[110px]"></textarea>
      <div className="flex items-center justify-between gap-3 px-3 pb-3">
        <span className="text-[12px] text-muted pl-1 hidden sm:block">Ctrl + Enter — отправить</span>
        <button type="submit" disabled=${!text.trim() || !!busy}
          className="ml-auto h-11 px-5 rounded-lg bg-brand text-on-brand font-semibold inline-flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed w-full sm:w-auto justify-center">
          Отправить в ИИ ${icons.send('w-4 h-4')}</button>
      </div>
    </form>

    <div ref=${resultRef} className="scroll-mt-24">
      ${busy ? html`<${Checking} dur=${busy.dur}/>` : result ? html`<${ResultCard} r=${result} onDecide=${decideWarn} openJournal=${openJournal}/>` : html`<${Intro}/>`}
    </div>
    ${dialog && result && html`<${WarnDialog} types=${result.analysis.types} onAnon=${() => decideWarn('anonymized')} onCancel=${() => decideWarn('cancelled')}/>`}
  </div>`;
}

/* ---------- вкладка «Журнал ИБ» ---------- */
function Counter({ label, value, tone }) {
  return html`<div className="rounded-lg border border-line bg-surface px-3.5 py-3 min-w-0">
    <div className="flex items-center gap-1.5 text-[12.5px] text-muted font-medium leading-tight">${tone && html`<span className=${`w-2 h-2 rounded-full shrink-0 ${tone}`}></span>`}${label}</div>
    <div className="mt-1 text-[28px] font-bold tnum leading-none text-ink">${value}</div>
  </div>`;
}

function DecisionCell({ ev }) {
  return html`<div className="grid gap-1 justify-items-start">
    <${Badge} decision=${ev.decision}/>
    ${ev.outcome && html`<span className=${`text-[11.5px] ${ev.outcome === 'pending' ? 'text-warn' : 'text-muted'}`}>${OUTCOME[ev.outcome]}</span>`}
  </div>`;
}
const NewPill = () => html`<span className="inline-flex items-center rounded-full bg-brand text-on-brand text-[10.5px] font-bold uppercase tracking-wide px-1.5 py-px">новое</span>`;

function JournalTab({ events }) {
  const [filter, setFilter] = useState('all');
  const shown = filter === 'all' ? events : events.filter((e) => e.decision === filter);
  const count = (d) => events.filter((e) => e.decision === d).length;

  const FILTERS = [['all', 'Все', events.length], ['allow', 'Разрешено', count('allow')], ['anon', 'Обезличено', count('anon')], ['warn', 'Предупреждения', count('warn')], ['block', 'Заблокировано', count('block')]];

  return html`<div className="grid gap-4">
    <div>
      <div><div className="eyebrow">Сегодня, ${todayLabel()}</div><h2 className="text-[20px] font-bold mt-0.5">События проверки запросов</h2></div>
    </div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
      <${Counter} label="Всего проверок" value=${events.length}/>
      <${Counter} label="Обезличено" value=${count('anon')} tone="bg-anon"/>
      <${Counter} label="Предупреждений" value=${count('warn')} tone="bg-warn"/>
      <${Counter} label="Заблокировано" value=${count('block')} tone="bg-block"/>
    </div>

    <div className="scroll-x -mx-4 px-4 sm:mx-0 sm:px-0">
      <div role="radiogroup" aria-label="Фильтр по решению" className="flex gap-1.5 w-max">
        ${FILTERS.map(([id, label, n]) => html`<button key=${id} id=${'flt-' + id} role="radio" aria-checked=${filter === id} onClick=${() => setFilter(id)}
          className=${`h-9 px-3 rounded-full text-[13.5px] font-semibold border whitespace-nowrap inline-flex items-center gap-1.5 ${filter === id ? 'bg-brand text-on-brand border-brand' : 'bg-surface border-line text-ink hover:border-brand/50'}`}>
          ${id !== 'all' && html`<span className=${`w-2 h-2 rounded-full ${DEC[id].dot}`}></span>`}${label}<span className="opacity-70 tnum">${n}</span></button>`)}
      </div>
    </div>

    ${shown.length === 0 && html`<div className="rounded-lg border border-dashed border-line p-6 text-center text-muted">Событий с таким решением пока нет.</div>`}

    <ul className="grid gap-2.5 md:hidden">
      ${shown.map((e) => html`<li key=${e.id} className=${`rounded-lg border bg-surface p-3.5 ${e.isNew ? 'border-brand/60 flash' : 'border-line'}`}>
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="flex items-center gap-2 flex-wrap"><span className="font-semibold">${e.employee}</span>${e.isNew && html`<${NewPill}/>`}</div>
            <div className="text-[12.5px] text-muted">${e.dept} · ${e.service ? e.service + ' · ' : ''}<span className="tnum">${e.time}</span></div>
          </div>
          <${DecisionCell} ev=${e}/>
        </div>
        ${e.types.length > 0 && html`<div className="flex flex-wrap gap-1 mt-2.5">${e.types.map((t) => html`<${TypeChip} key=${t} type=${t}/>`)}</div>`}
        <div className="mono text-[12.5px] mt-2.5 rounded-md bg-sunken px-2.5 py-2 break-words text-ink/90">${e.fragment}</div>
      </li>`)}
    </ul>

    ${shown.length > 0 && html`<div className="hidden md:block overflow-x-auto rounded-xl border border-line bg-surface">
      <table className="w-full text-[13.5px] border-collapse">
        <thead><tr className="text-left text-muted bg-sunken/70">
          ${['Время', 'Сотрудник', 'ИИ-сервис', 'Найдено', 'Решение', 'Фрагмент запроса'].map((h) => html`<th key=${h} className="px-3 py-2.5 font-semibold text-[12px] uppercase tracking-[.06em] whitespace-nowrap">${h}</th>`)}
        </tr></thead>
        <tbody>${shown.map((e) => html`<tr key=${e.id} className=${`border-t border-line align-top ${e.isNew ? 'flash bg-brand-soft/40' : ''}`}>
          <td className="px-3 py-3 tnum whitespace-nowrap">${e.time}${e.isNew && html`<div className="mt-1"><${NewPill}/></div>`}</td>
          <td className="px-3 py-3 whitespace-nowrap"><div className="font-semibold">${e.employee}</div><div className="text-muted text-[12.5px]">${e.dept}</div></td>
          <td className="px-3 py-3 whitespace-nowrap">${e.service || html`<span className="text-muted">—</span>`}</td>
          <td className="px-3 py-3"><div className="flex flex-wrap gap-1 max-w-[170px]">${e.types.length ? e.types.map((t) => html`<${TypeChip} key=${t} type=${t}/>`) : html`<span className="text-muted">—</span>`}</div></td>
          <td className="px-3 py-3"><${DecisionCell} ev=${e}/></td>
          <td className="px-3 py-3 mono text-[12.5px] min-w-[240px] break-words">${e.fragment}</td>
        </tr>`)}</tbody>
      </table>
    </div>`}

    <p className="text-[12.5px] text-muted">Исходные значения в журнал не попадают: служба ИБ видит тип данных и замаскированный фрагмент.</p>
  </div>`;
}

/* ---------- приложение ---------- */
function App() {
  const [tab, setTab] = useState(() => (location.hash === '#journal' ? 'journal' : 'employee'));
  const [events, setEvents] = useState(() => SEED.map((s) => makeEvent(...s)));
  const [unseen, setUnseen] = useState(0);

  const go = (t) => { setTab(t); if (t === 'journal') setUnseen(0); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const onLog = (analysis, outcome) => {
    const ev = { id: nextId++, time: nowTime(), employee: 'Вы', dept: 'Ваш отдел', service: '', types: analysis.types, decision: analysis.decision, fragment: analysis.masked, outcome, isNew: true };
    setEvents((list) => [ev, ...list]);
    setUnseen((n) => n + 1);
    return ev.id;
  };
  const onUpdateLog = (id, outcome) => setEvents((list) => list.map((e) => (e.id === id ? { ...e, outcome } : e)));

  return html`<div className="min-h-full flex flex-col">
    <header className="sticky z-40 bg-bg/90 backdrop-blur border-b border-line" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
      <div className="gutter max-w-4xl mx-auto py-3 grid gap-3 sm:flex sm:items-center sm:justify-between">
        <${Logo}/>
        <${Tabs} tab=${tab} setTab=${go} unseen=${unseen}/>
      </div>
    </header>
    <main className="gutter max-w-4xl w-full mx-auto py-5 flex-1">
      ${tab === 'employee'
        ? html`<${EmployeeTab} onLog=${onLog} onUpdateLog=${onUpdateLog} openJournal=${() => go('journal')}/>`
        : html`<${JournalTab} events=${events}/>`}
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
