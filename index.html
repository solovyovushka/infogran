<script id="detector">
/* ===== Детектор: регулярки и правила ===== */
const TYPES = {
  FIO:      { label: 'ФИО',         tag: 'ФИО',         level: 'anon' },
  PHONE:    { label: 'Телефон',     tag: 'ТЕЛЕФОН',     level: 'anon' },
  EMAIL:    { label: 'Email',       tag: 'EMAIL',       level: 'anon' },
  IP:       { label: 'IP-адрес',    tag: 'IP',          level: 'anon' },
  INN:      { label: 'ИНН',         tag: 'ИНН',         level: 'warn' },
  ORG:      { label: 'Организация', tag: 'ОРГАНИЗАЦИЯ', level: 'warn' },
  ACCOUNT:  { label: 'Счёт',        tag: 'СЧЁТ',        level: 'block' },
  CARD:     { label: 'Карта',       tag: 'КАРТА',       level: 'block' },
  PASSPORT: { label: 'Паспорт',     tag: 'ПАСПОРТ',     level: 'block' },
  APIKEY:   { label: 'Ключ API',    tag: 'КЛЮЧ',        level: 'block' },
  PASSWORD: { label: 'Пароль',      tag: 'ПАРОЛЬ',      level: 'block' },
};
const TAG_TO_TYPE = Object.fromEntries(Object.entries(TYPES).map(([k, t]) => [t.tag, k]));

const isPatronymic = (w) => /(?:вич|вн|ичн|ьич)[а-яё]{0,3}$/i.test(w);

// Порядок = приоритет при пересечении: первое найденное правило забирает фрагмент.
// Значение всегда в именованной группе v, и она стоит в конце совпадения.
const RULES = [
  ['PASSWORD', /(?:password|passwd|pwd|пароль)\s*[:=]\s*["']?(?<v>[^\s"',;]+)/gi],
  ['APIKEY',   /(?:api[_-]?key|apikey|access[_-]?token|token|secret|client[_-]?secret)\s*[:=]\s*["']?(?<v>[^\s"',;]+)/gi],
  ['APIKEY',   /(?<v>\b(?:sk|pk|rk)-[A-Za-z0-9_-]{8,})/g],
  ['APIKEY',   /(?<v>\b(?:gh[pousr]_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{12,}|xox[bpa]-[A-Za-z0-9-]{10,}))/g],
  ['ACCOUNT',  /(?<v>\b40\d{18}\b)/g],
  ['CARD',     /(?<v>\b\d{4}(?:[ -]?\d{4}){3}\b)/g],
  ['PASSPORT', /паспорт[а-яё]*\s*(?:рф\s*)?[:,]?\s*(?:серия\s*)?(?<v>\d{2}\s?\d{2}\s*(?:№|номер)?\s*\d{6})(?!\d)/gi],
  ['PASSPORT', /(?<v>\b\d{2}\s\d{2}\s\d{6}\b)/g],
  ['PHONE',    /(?<v>(?:\+7|\b8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2})(?!\d)/g],
  ['INN',      /(?<v>\b(?:\d{12}|\d{10})\b)/g],
  ['EMAIL',    /(?<v>[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/g],
  ['IP',       /(?<v>\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b)(?!\.\d)/g],
  ['ORG',      /(?:^|[^А-ЯЁа-яёA-Za-z])(?<v>(?:ООО|ОАО|ЗАО|ПАО|АО|ИП|НКО)\s*["«„“][^"»“”]{1,60}["»“”])/g],
  ['FIO',      /(?<v>[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+)/g, (v) => v.split(/\s+/).some(isPatronymic)],
  ['FIO',      /(?<v>[А-ЯЁ][а-яё]+\s+[А-ЯЁ]\.\s?[А-ЯЁ]\.)/g],
  ['FIO',      /(?<v>[А-ЯЁ]\.\s?[А-ЯЁ]\.\s?[А-ЯЁ][а-яё]+)/g],
];

function detect(text) {
  const found = [];
  for (const [type, re, validate] of RULES) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      const v = m.groups.v;
      const start = m.index + m[0].length - v.length;
      const end = start + v.length;
      if (validate && !validate(v)) { re.lastIndex = m.index + 1; continue; }
      if (!found.some((f) => start < f.end && end > f.start)) found.push({ type, start, end, value: v });
    }
  }
  return found.sort((a, b) => a.start - b.start);
}

const LEVEL_RANK = { block: 3, warn: 2, anon: 1 };
function decide(findings) {
  let top = 0;
  for (const f of findings) top = Math.max(top, LEVEL_RANK[TYPES[f.type].level]);
  return ['allow', 'anon', 'warn', 'block'][top];
}

// Обратимое обезличивание: словарь «метка → исходное значение» живёт только в памяти.
function anonymize(text, findings) {
  const counters = {}, byValue = {}, dict = {};
  let out = '', pos = 0;
  for (const f of findings) {
    const t = TYPES[f.type].tag;
    const key = f.type + '|' + f.value;
    let tag = byValue[key];
    if (!tag) {
      counters[t] = (counters[t] || 0) + 1;
      tag = `<${t}_${counters[t]}>`;
      byValue[key] = tag;
      dict[tag] = f.value;
    }
    out += text.slice(pos, f.start) + tag;
    pos = f.end;
  }
  return { sent: out + text.slice(pos), dict };
}
const restore = (text, dict) => text.replace(/<[A-ZА-ЯЁ]+_\d+>/g, (t) => dict[t] ?? t);

function maskValue(type, v) {
  const d = v.replace(/\D/g, '');
  switch (type) {
    case 'PHONE':    return `+7 ${d.slice(1, 4)} ***-**-${d.slice(-2)}`;
    case 'EMAIL':    { const [u, dom] = v.split('@'); return `${u[0]}***@${dom}`; }
    case 'FIO':      return v.split(/\s+/).map((w) => (w.endsWith('.') ? w : w[0] + '***')).join(' ');
    case 'INN':      return d.slice(0, 2) + '*'.repeat(d.length - 4) + d.slice(-2);
    case 'ACCOUNT':  return d.slice(0, 5) + '*'.repeat(11) + d.slice(-4);
    case 'CARD':     return '**** **** **** ' + d.slice(-4);
    case 'PASSPORT': return '** ** ****' + d.slice(-2);
    case 'APIKEY':   { const p = v.match(/^[A-Za-z]+[-_](?:live[-_]|test[-_])?/); return (p ? p[0] : v.slice(0, 3)) + '****'; }
    case 'PASSWORD': return '********';
    case 'IP':       { const p = v.split('.'); return `${p[0]}.${p[1]}.*.*`; }
    case 'ORG':      return v.replace(/(["«„“])(.)[^"»“”]*(["»“”])/, '$1$2***$3');
    default:         return '***';
  }
}
function maskText(text, findings) {
  let out = '', pos = 0;
  for (const f of findings) { out += text.slice(pos, f.start) + maskValue(f.type, f.value); pos = f.end; }
  return out + text.slice(pos);
}

function analyze(text) {
  const findings = detect(text);
  const types = [...new Set(findings.map((f) => f.type))];
  return { text, findings, types, decision: decide(findings), masked: maskText(text, findings) };
}

/* ===== Имитация ответа ИИ (работает только с метками) ===== */
function mockAnswer(sent) {
  const tags = [...new Set(sent.match(/<[A-ZА-ЯЁ]+_\d+>/g) || [])];
  const first = (t) => tags.find((x) => x.startsWith('<' + t + '_'));
  if (/REST|GraphQL/i.test(sent)) {
    return 'REST и GraphQL — два подхода к построению API.\n\n• REST: много адресов-ресурсов (/users/42, /users/42/orders), у каждого фиксированный формат ответа. Легко кэшировать средствами HTTP.\n• GraphQL: один адрес, а клиент сам описывает в запросе, какие поля ему нужны. Нет лишних данных и лишних запросов, но сложнее кэширование и контроль нагрузки на сервер.\n\nКоротко: REST проще и привычнее, GraphQL удобнее, когда клиенту нужны данные из многих связанных сущностей.';
  }
  if (/письм/i.test(sent)) {
    const fio = first('ФИО'), phone = first('ТЕЛЕФОН'), email = first('EMAIL');
    let s = 'Тема: перенос сроков сдачи проекта\n';
    if (fio) s += `Получатель: ${fio}\n`;
    s += '\nДобрый день!\n\nСообщаем, что срок сдачи проекта переносится на две недели. Причина — дополнительное согласование технических требований. Остальные условия договора не меняются.\n\nОбновлённый график работ направим в течение двух рабочих дней.';
    if (phone) s += ` Если удобно обсудить детали голосом, мы перезвоним по номеру ${phone}.`;
    else if (email) s += ` Вопросы можно задать в ответном письме на ${email}.`;
    return s + '\n\nС уважением,\nкоманда проекта';
  }
  if (/договор|реквизит|ИНН|сч[её]т/i.test(sent)) {
    const org = first('ОРГАНИЗАЦИЯ'), inn = first('ИНН');
    let s = `Проверил договор${org ? ' с ' + org : ''}. На что обратить внимание:\n\n`;
    s += '• Срок оплаты не привязан к дате подписания акта — лучше указать конкретное число дней.\n• Нет пункта об ответственности за просрочку поставки.\n';
    if (inn) s += `• Сверьте ИНН ${inn} с выпиской из ЕГРЮЛ перед подписанием.\n`;
    return s + '\nВ остальном формулировки стандартные.';
  }
  let s = 'Разобрал запрос. Предлагаю действовать по шагам: уточнить цель, собрать исходные данные и проверить решение на небольшом примере. Пришлите больше контекста — отвечу подробнее.';
  if (tags.length) s += '\n\nВ ответе учтены: ' + tags.join(', ') + '.';
  return s;
}
</script>

}
const fmtSec = (ms) => (ms / 1000).toFixed(1).replace('.', ',') + ' с';
const nowTime = () => new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const todayLabel = () => new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
const OUTCOME = { anonymized: 'сотрудник обезличил и отправил', cancelled: 'сотрудник отменил отправку', pending: 'ожидает решения сотрудника' };

/* ---------- иконки ---------- */
const I = (d, cls = 'w-4 h-4') => html`<svg viewBox="0 0 24 24" className=${cls} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${d}</svg>`;

const DEC_ICON = { allow: icons.check, anon: icons.mask, warn: icons.alert, block: icons.lock };

/* ---------- мелкие компоненты ---------- */
function Badge({ decision, big }) {

function TypeChip({ type }) {

  let pos = 0;
  findings.forEach((f, i) => {
    if (f.start > pos) parts.push(text.slice(pos, f.start));
    const t = TYPES[f.type];
    parts.push(html`<mark key=${'f' + i} className=${`rounded px-1 py-px ring-1 ring-inset ${LEVEL_CLS[t.level]}`} style=${{ boxDecorationBreak: 'clone', WebkitBoxDecorationBreak: 'clone' }}>
      <span className="text-[10px] font-bold uppercase tracking-wide mr-1 opacity-80 align-[1px]">${t.label}</span>${f.value}</mark>`);
    pos = f.end;
  });
  parts.push(text.slice(pos));
  return html`<p className="leading-[1.9] break-words">${parts}</p>`;
}

// Текст с метками: метки — оранжевые плашки; restoreDict — показать исходные значения вместо меток
function TagText({ text, restoreDict }) {
  const parts = text.split(/(<[A-ZА-ЯЁ]+_\d+>)/g);
  return html`<div className="whitespace-pre-wrap break-words leading-relaxed">${parts.map((p, i) => {
    const m = p.match(/^<([A-ZА-ЯЁ]+)_\d+>$/);
    if (!m) return p;
    if (restoreDict) return html`<span key=${i} className="rounded bg-ok-bg text-ok px-1 font-medium" title=${'восстановлено из ' + p}>${restoreDict[p] ?? p}</span>`;
    const lvl = TYPES[TAG_TO_TYPE[m[1]]]?.level || 'anon';
    return html`<span key=${i} className=${`mono text-[12.5px] rounded px-1 py-px ring-1 ring-inset whitespace-nowrap ${LEVEL_CLS[lvl]}`}>${p}</span>`;
  })}</div>`;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function EmployeeTab({ onLog, onUpdateLog, openJournal }) {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(null);       // { dur }
  const [result, setResult] = useState(null);
  const [dialog, setDialog] = useState(false);
  const resultRef = useRef(null);

  const submit = () => {
    const t = text.trim();
    if (!t || busy) return;
    const dur = 600 + Math.round(Math.random() * 400);
    setResult(null);
    setBusy({ dur });
    setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    setTimeout(() => {
      const analysis = analyze(t);
      const r = { analysis, ms: dur, outcome: null, sent: null, answer: null, dict: {} };
      if (analysis.decision === 'allow') { r.sent = t; r.answer = mockAnswer(t); }
      if (analysis.decision === 'anon') { const an = anonymize(t, analysis.findings); r.sent = an.sent; r.dict = an.dict; r.answer = mockAnswer(an.sent); }
      if (analysis.decision === 'warn') { r.outcome = 'pending'; setDialog(true); }
      r.logId = onLog(analysis, r.outcome);
      setBusy(null);
      setResult(r);
    }, dur);
  };

  const decideWarn = (choice) => {
    if (choice === 'reopen') return setDialog(true);
    setDialog(false);
    setResult((r) => {
      const n = { ...r, outcome: choice };
      if (choice === 'anonymized') { const an = anonymize(r.analysis.text, r.analysis.findings); n.sent = an.sent; n.dict = an.dict; n.answer = mockAnswer(an.sent); }
      onUpdateLog(r.logId, choice);
      return n;
    });
  };

  return html`<div className="grid gap-4">
    <div>
      <div className="eyebrow mb-2">Примеры запросов</div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
        ${EXAMPLES.map((e, i) => html`<button key=${i} id=${'ex-' + i} onClick=${() => setText(e.text)}
          className=${`text-left rounded-lg border px-3 py-2.5 text-[13.5px] font-semibold leading-snug transition-colors ${text === e.text ? 'border-brand bg-brand-soft text-brand' : 'border-line bg-surface hover:border-brand/50'}`}>
          <span className="block text-[11px] font-medium text-muted mb-0.5 tnum">Пример ${i + 1}</span>${e.label}</button>`)}
      </div>
    </div>

    <form onSubmit=${(e) => { e.preventDefault(); submit(); }} className="rounded-xl border border-line bg-surface shadow-sm focus-within:border-brand/60">
      <label htmlFor="prompt" className="flex items-center justify-between px-4 pt-3 eyebrow"><span>Запрос к ИИ</span></label>
      <textarea id="prompt" rows="4" value=${text} onInput=${(e) => setText(e.target.value)} onChange=${(e) => setText(e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); }}
        placeholder="Например: составь письмо клиенту о переносе сроков…"
        className="block w-full resize-y bg-transparent px-4 py-2 text-[16px] leading-relaxed outline-none placeholder:text-muted/70 min-h-[110px]"></textarea>
      <div className="flex items-center justify-between gap-3 px-3 pb-3">
        <span className="text-[12px] text-muted pl-1 hidden sm:block">Ctrl + Enter — отправить</span>
        <button type="submit" disabled=${!text.trim() || !!busy}
          className="ml-auto h-11 px-5 rounded-lg bg-brand text-on-brand font-semibold inline-flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed w-full sm:w-auto justify-center">
          Отправить в ИИ ${icons.send('w-4 h-4')}</button>
      </div>
    </form>

    <div ref=${resultRef} className="scroll-mt-24">
      ${busy ? html`<${Checking} dur=${busy.dur}/>` : result ? html`<${ResultCard} r=${result} onDecide=${decideWarn} openJournal=${openJournal}/>` : html`<${Intro}/>`}
    </div>
    ${dialog && result && html`<${WarnDialog} types=${result.analysis.types} onAnon=${() => decideWarn('anonymized')} onCancel=${() => decideWarn('cancelled')}/>`}
  </div>`;
}

function App() {
  const [tab, setTab] = useState(() => (location.hash === '#journal' ? 'journal' : 'employee'));
  const [events, setEvents] = useState(() => SEED.map((s) => makeEvent(...s)));
  const [unseen, setUnseen] = useState(0);

  const go = (t) => { setTab(t); if (t === 'journal') setUnseen(0); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const onLog = (analysis, outcome) => {
    const ev = { id: nextId++, time: nowTime(), employee: 'Вы', dept: 'Ваш отдел', service: '', types: analysis.types, decision: analysis.decision, fragment: analysis.masked, outcome, isNew: true };
    setEvents((list) => [ev, ...list]);
    setUnseen((n) => n + 1);
    return ev.id;
  };
  const onUpdateLog = (id, outcome) => setEvents((list) => list.map((e) => (e.id === id ? { ...e, outcome } : e)));

  return html`<div className="min-h-full flex flex-col">
    <header className="sticky z-40 bg-bg/90 backdrop-blur border-b border-line" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
      <div className="gutter max-w-4xl mx-auto py-3 grid gap-3 sm:flex sm:items-center sm:justify-between">
        <${Logo}/>
        <${Tabs} tab=${tab} setTab=${go} unseen=${unseen}/>
      </div>
    </header>
    <main className="gutter max-w-4xl w-full mx-auto py-5 flex-1">
      ${tab === 'employee'
        ? html`<${EmployeeTab} onLog=${onLog} onUpdateLog=${onUpdateLog} openJournal=${() => go('journal')}/>`
        : html`<${JournalTab} events=${events}/>`}
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
